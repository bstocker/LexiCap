name: Déployer LexiCap sur PythonAnywhere

# Déclenché à chaque push sur main, et manuellement via le bouton "Run workflow".
#
# Étapes :
#   1. appelle le webhook /deploy de l'app → elle fait un `git pull` sur PythonAnywhere ;
#   2. recharge la web app via l'API officielle de reload.
#
# Secrets nécessaires (Settings > Secrets and variables > Actions) :
#   DEPLOY_TOKEN       jeton partagé avec ~/mysite/.env sur PythonAnywhere
#   PA_WEBAPP_DOMAIN   ex: cassy.pythonanywhere.com
#   PA_USERNAME        votre nom d'utilisateur PythonAnywhere
#   PA_TOKEN           token API PythonAnywhere
#   PA_HOST            (optionnel) eu.pythonanywhere.com si compte EU
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tirer le code sur PythonAnywhere (webhook /deploy)
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --retry-delay 3 -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://${{ secrets.PA_WEBAPP_DOMAIN }}/deploy"
          echo ""
          echo "git pull déclenché."

      - name: Recharger la web app
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.PA_HOST }}"
          if [[ -z "${HOST}" ]]; then HOST="www.pythonanywhere.com"; fi
          curl -sS --fail --retry 3 --retry-delay 3 -X POST \
            -H "Authorization: Token ${{ secrets.PA_TOKEN }}" \
            "https://${HOST}/api/v0/user/${{ secrets.PA_USERNAME }}/webapps/${{ secrets.PA_WEBAPP_DOMAIN }}/reload/" \
            >/dev/null
          echo "Web app rechargée : https://${{ secrets.PA_WEBAPP_DOMAIN }}/"
