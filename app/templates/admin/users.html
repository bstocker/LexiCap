{% extends "base.html" %}
{% block title %}Utilisateurs — LexiCap{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h4 mb-0">Utilisateurs</h1>
  <a href="{{ url_for('admin.new_user') }}" class="btn btn-primary btn-sm">+ Nouvel utilisateur</a>
</div>
<div class="card shadow-sm">
  <table class="table table-hover mb-0">
    <thead><tr><th>Email</th><th>Nom</th><th>Rôle</th><th>Actif</th><th></th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.email }}</td>
        <td>{{ u.full_name }}</td>
        <td><span class="badge badge-soft">{{ u.role_label }}</span></td>
        <td>{{ "Oui" if u.active else "Non" }}</td>
        <td class="text-end"><a href="{{ url_for('admin.edit_user', user_id=u.id) }}" class="btn btn-sm btn-outline-secondary">Modifier</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
